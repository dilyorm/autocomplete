<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <!-- acomplete demo. Pure SMIL, no script: GitHub renders it as an animated image.
       12s loop, two scenes: (A) ghost-text + Tab accept, (B) Ctrl+R rephrase + undo. -->
  <defs>
    <clipPath id="typeA"><rect x="48" y="92" width="0" height="30">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;238;238;620;620;620" keyTimes="0;0.03;0.15;0.188;0.19;0.47;1"/>
    </rect></clipPath>
    <clipPath id="typeB"><rect x="48" y="92" width="0" height="30">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;0;190;190;190;0" keyTimes="0;0.50;0.52;0.60;0.62;0.985;1"/>
    </rect></clipPath>
  </defs>

  <!-- terminal chrome -->
  <rect x="0" y="0" width="760" height="440" rx="14" fill="#11111b"/>
  <rect x="0" y="0" width="760" height="40" rx="14" fill="#181825"/>
  <rect x="0" y="26" width="760" height="14" fill="#181825"/>
  <circle cx="24" cy="20" r="6" fill="#f38ba8"/>
  <circle cx="46" cy="20" r="6" fill="#f9e2af"/>
  <circle cx="68" cy="20" r="6" fill="#a6e3a1"/>
  <text x="380" y="25" fill="#6c7086" font-size="13" text-anchor="middle">acomplete claude</text>

  <!-- prompt prefix -->
  <text x="24" y="114" fill="#89b4fa" font-size="18">&#10095;</text>

  <!-- ===== Scene A: ghost text + Tab ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="1;1;0;0" keyTimes="0;0.47;0.49;1"/>
    <!-- typed prompt, revealed left-to-right -->
    <g clip-path="url(#typeA)">
      <text x="48" y="114" font-size="18" fill="#cdd6f4">add a dark mode toggle</text>
    </g>
    <!-- ghost suffix: grey, fades in, turns green on accept -->
    <text x="285" y="114" font-size="18" fill="#6c7086" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1" keyTimes="0;0.19;0.21;1"/>
      <animate attributeName="fill" dur="12s" repeatCount="indefinite"
        values="#6c7086;#6c7086;#a6e3a1;#a6e3a1" keyTimes="0;0.29;0.305;1"/>
      &#32;and persist it to localStorage</text>
    <!-- caret -->
    <rect y="98" width="9" height="22" fill="#cdd6f4">
      <animate attributeName="x" dur="12s" repeatCount="indefinite"
        values="48;48;286;286;620;620" keyTimes="0;0.03;0.15;0.29;0.30;1"/>
      <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
        values="1;1;0;0" keyTimes="0;0.5;0.5;1"/>
    </rect>
    <!-- caption -->
    <text x="48" y="240" font-size="15" fill="#bac2de">Type a prompt, pause — grey
      <tspan fill="#6c7086">ghost text</tspan> appears.</text>
    <text x="48" y="266" font-size="15" fill="#bac2de">Press
      <tspan fill="#89b4fa">Tab</tspan> to accept it
      <tspan fill="#a6e3a1">(turns green)</tspan>.</text>
  </g>

  <!-- ===== Scene B: Ctrl+R rephrase + Shift+Backspace undo ===== -->
  <g opacity="0">
    <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
      values="0;0;1;1;0" keyTimes="0;0.49;0.50;0.985;1"/>
    <!-- original prompt: typed in, hidden on Ctrl+R, restored on undo -->
    <g opacity="1">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="1;1;0;0;1;1" keyTimes="0;0.65;0.66;0.85;0.86;1"/>
      <g clip-path="url(#typeB)">
        <text x="48" y="114" font-size="18" fill="#cdd6f4">make login better</text>
      </g>
    </g>
    <!-- rewritten prompt: replaces it on Ctrl+R, removed again on undo -->
    <text x="48" y="114" font-size="18" fill="#cdd6f4" opacity="0">Add inline validation, error and loading states to the login form
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite"
        values="0;0;1;1;0;0" keyTimes="0;0.65;0.66;0.85;0.855;1"/></text>
    <!-- caption -->
    <text x="48" y="240" font-size="15" fill="#bac2de">Press
      <tspan fill="#89b4fa">Ctrl+R</tspan> — the whole prompt is rewritten clearer.</text>
    <text x="48" y="266" font-size="15" fill="#bac2de">
      <tspan fill="#89b4fa">Shift+Backspace</tspan> puts your original prompt back.</text>
  </g>

  <!-- key legend (always on) -->
  <g transform="translate(48,360)" font-size="13">
    <rect x="0" y="0" width="664" height="44" rx="10" fill="#181825"/>
    <text x="20" y="28" fill="#89b4fa">Tab</text>
    <text x="56" y="28" fill="#6c7086">accept</text>
    <text x="140" y="28" fill="#89b4fa">&#8594;</text>
    <text x="160" y="28" fill="#6c7086">word</text>
    <text x="232" y="28" fill="#89b4fa">Ctrl+R</text>
    <text x="290" y="28" fill="#6c7086">rephrase</text>
    <text x="392" y="28" fill="#89b4fa">Shift+Backspace</text>
    <text x="520" y="28" fill="#6c7086">undo</text>
  </g>
</svg>
